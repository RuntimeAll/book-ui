<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI·备课助手 · 教培老师的命题外脑</title>
    <!-- PRD-A-017 举一反三换皮字体：IBM Plex Sans/SC/Mono（display=swap 不阻塞渲染，缺则系统 sans 兜底） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- MathJax 3.x — Q' 卡试卷预览 LaTeX 渲染。startup.typeset:false 由 utils/mathjax.ts 手动控制。 -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true,
          packages: { '[+]': ['ams', 'noerrors', 'noundefined'] }
        },
        options: {
          skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
          ignoreHtmlClass: 'tex2jax_ignore',
          processHtmlClass: 'tex2jax_process'
        },
        // 自托管显式字体路径(同源)：async 脚本 base 探测兜底，确保 woff-v2 字体从本站加载。
        chtml: {
          fontURL: '/mathjax/es5/output/chtml/fonts/woff-v2'
        },
        startup: {
          typeset: false
        }
      };
    </script>
    <!-- 🔴 自托管 MathJax(同源)：jsdelivr CDN 在国内 prod(http://jpjia.cn) 不稳/被墙 →
         window.MathJax 注入不进来 → 公式裸显示 LaTeX 源码。改用 public/mathjax/es5(精简:
         tex-mml-chtml + tex扩展 + chtml字体, 跳过 svg/sre 共~1.9MB)随 dist 部署同源 serve。 -->
    <script src="/mathjax/es5/tex-mml-chtml.js" async></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
